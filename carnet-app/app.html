<title>Carnet B Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar; road-sign blue/red/yellow on cool asphalt neutrals */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --sunk:#E3E9F0; --ink:#132033; --muted:#58667A; --line:#D3DBE5;
  --blue:#1D5BB8; --blue-ink:#FFFFFF; --red:#C1121F; --amber:#E9A800; --ok:#177A43; --ok-bg:#E2F4EA; --bad:#B4161F; --bad-bg:#FBE6E7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#17202B; --sunk:#111922; --ink:#E6ECF3; --muted:#93A1B4; --line:#283444;
  --blue:#3F7FE0; --blue-ink:#FFFFFF; --red:#F0505D; --amber:#F5C33B; --ok:#45C67F; --ok-bg:#12301F; --bad:#FF6B75; --bad-bg:#3A1519; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#17202B; --sunk:#111922; --ink:#E6ECF3; --muted:#93A1B4; --line:#283444;
  --blue:#3F7FE0; --blue-ink:#FFFFFF; --red:#F0505D; --amber:#F5C33B; --ok:#45C67F; --ok-bg:#12301F; --bad:#FF6B75; --bad-bg:#3A1519; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .plate{width:34px;height:34px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;font-weight:700;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--blue)}
.brand b{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 11px;font-weight:600;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* Motorway-style information panel */
.panel{background:var(--blue);color:var(--blue-ink);border-radius:16px;padding:6px}
.panel-in{border:3px solid rgba(255,255,255,.92);border-radius:11px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.panel h1{font-size:2.3rem;letter-spacing:.01em}
.panel .facts{display:flex;flex-wrap:wrap;gap:8px}
.panel .facts span{font-family:var(--display);font-size:1.05rem;font-weight:600;border:2px solid rgba(255,255,255,.85);border-radius:6px;padding:2px 9px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;font-weight:600;min-height:48px;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel .btn.primary{background:#fff;color:#0F2F66;border-color:#fff;font-size:1.05rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip{padding:7px 12px;font-size:.88rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bar .track{grid-column:1/-1;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--blue)}
.bar .fill.low{background:var(--red)} .bar .fill.mid{background:var(--amber)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t small{color:var(--muted)}
.sg{width:44px;height:44px;flex:none;display:block}
.sg.big{width:132px;height:132px;margin:4px auto 0}
.chev{color:var(--muted);font-size:1.3rem}
.theory h3{margin-top:4px}
.theory ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.theory li{max-width:65ch}
.theory strong{color:var(--ink)}
/* Quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:8px;background:var(--sunk)}
.timer.warn{background:var(--bad-bg);color:var(--bad)}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid30 button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.72rem;font-weight:600;padding:0;font-variant-numeric:tabular-nums;color:var(--muted)}
.grid30 button.done{background:var(--sunk);color:var(--ink)}
.grid30 button.cur{border:2px solid var(--blue);color:var(--blue)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue)}
.qtext{font-size:1.15rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:52px;width:100%}
.opt .k{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--sunk)}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.explain{border-left:4px solid var(--amber);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.95rem}
.verdict{text-align:center;padding:22px 16px;border-radius:16px;color:#fff}
.verdict.pass{background:var(--ok)} .verdict.fail{background:var(--red)}
.verdict h1{font-size:3rem;letter-spacing:.04em}
.review{display:flex;flex-direction:column;gap:12px}
.review .card{display:flex;flex-direction:column;gap:8px}
.ans{font-size:.92rem;display:flex;gap:8px}
.ans.ok{color:var(--ok)} .ans.bad{color:var(--bad)}
.confirm{border:1.5px solid var(--amber);background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--blue)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:.65rem;padding:0 6px;margin-left:2px}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion: no-preference){.opt,.btn{transition:background-color .15s,border-color .15s}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><div class="plate">B</div><b id="brandName">Carnet B</b></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="lang-es" data-lang="0">ES</button><button id="lang-en" data-lang="1">EN</button>
  </div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>

<script>
/* ============ Road-sign drawings (physical sign colours, identical in both themes) ============ */
const RED='#C1121F',BLUE='#1D5BB8',YEL='#F4B400',BLK='#1A1A1A';
const sv=(inner,cls='sg')=>`<svg viewBox="0 0 100 100" class="${cls}" aria-hidden="true">${inner}</svg>`;
const TX=(t,size,fill,y=52)=>`<text x="50" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="${size}" fill="${fill}">${t}</text>`;
const OCT='68.4,5.6 94.4,31.6 94.4,68.4 68.4,94.4 31.6,94.4 5.6,68.4 5.6,31.6 31.6,5.6';
const diag=c=>`<g stroke="${c}" stroke-width="3">${[-12,-6,0,6,12].map(o=>`<line x1="${20+o}" y1="${80+o}" x2="${80+o}" y2="${20+o}"/>`).join('')}</g>`;
const SIG={
  max:n=>`<circle cx="50" cy="50" r="44" fill="#fff" stroke="${RED}" stroke-width="10"/>`+TX(n,n>99?38:46,BLK),
  min:n=>`<circle cx="50" cy="50" r="47" fill="${BLUE}"/>`+TX(n,n>99?38:46,'#fff'),
  adv:n=>`<rect x="6" y="6" width="88" height="88" rx="10" fill="${BLUE}"/>`+TX(n,n>99?40:48,'#fff'),
  endMax:n=>`<circle cx="50" cy="50" r="45" fill="#fff" stroke="#8A8A8A" stroke-width="4"/>`+TX(n,n>99?38:46,'#8A8A8A')+diag(BLK),
  stop:()=>`<polygon points="${OCT}" fill="${RED}" stroke="#fff" stroke-width="4"/>`+TX('STOP',30,'#fff',51),
  yield:()=>`<polygon points="6,12 94,12 50,90" fill="#fff" stroke="${RED}" stroke-width="9" stroke-linejoin="round"/>`,
  noEntry:()=>`<circle cx="50" cy="50" r="47" fill="${RED}"/><rect x="18" y="41" width="64" height="18" fill="#fff"/>`,
  closed:()=>`<circle cx="50" cy="50" r="43" fill="#fff" stroke="${RED}" stroke-width="10"/>`,
  noPark:()=>`<circle cx="50" cy="50" r="43" fill="${BLUE}" stroke="${RED}" stroke-width="10"/><line x1="22" y1="22" x2="78" y2="78" stroke="${RED}" stroke-width="10"/>`,
  noStop:()=>`<circle cx="50" cy="50" r="43" fill="${BLUE}" stroke="${RED}" stroke-width="10"/><line x1="22" y1="22" x2="78" y2="78" stroke="${RED}" stroke-width="10"/><line x1="78" y1="22" x2="22" y2="78" stroke="${RED}" stroke-width="10"/>`,
  prio:()=>`<g transform="rotate(45 50 50)"><rect x="19" y="19" width="62" height="62" fill="#fff" stroke="${BLK}" stroke-width="2"/><rect x="28" y="28" width="44" height="44" fill="${YEL}"/></g>`,
  endPrio:()=>SIG.prio()+`<g stroke="${BLK}" stroke-width="3"><line x1="22" y1="78" x2="78" y2="22"/><line x1="28" y1="82" x2="82" y2="28"/><line x1="18" y1="72" x2="72" y2="18"/></g>`,
  danger:()=>`<polygon points="50,7 95,88 5,88" fill="#fff" stroke="${RED}" stroke-width="8" stroke-linejoin="round"/>`+TX('!',44,BLK,62),
  arrow:d=>`<circle cx="50" cy="50" r="47" fill="${BLUE}"/><path d="M50 18 L74 46 H59 V82 H41 V46 H26 Z" fill="#fff" transform="rotate(${d} 50 50)"/>`,
  endAll:()=>`<circle cx="50" cy="50" r="45" fill="#fff" stroke="#8A8A8A" stroke-width="4"/>`+diag(BLK),
  noOvertake:()=>`<circle cx="50" cy="50" r="44" fill="#fff" stroke="${RED}" stroke-width="10"/>
    <rect x="22" y="44" width="24" height="18" rx="4" fill="${RED}"/><rect x="26" y="35" width="16" height="11" rx="3" fill="${RED}"/>
    <rect x="54" y="44" width="24" height="18" rx="4" fill="${BLK}"/><rect x="58" y="35" width="16" height="11" rx="3" fill="${BLK}"/>
    <rect x="24" y="62" width="5" height="6" fill="${RED}"/><rect x="39" y="62" width="5" height="6" fill="${RED}"/>
    <rect x="56" y="62" width="5" height="6" fill="${BLK}"/><rect x="71" y="62" width="5" height="6" fill="${BLK}"/>`,
  info:(t,bg=BLUE,size=34)=>`<rect x="6" y="6" width="88" height="88" rx="14" fill="${bg}"/><rect x="11" y="11" width="78" height="78" rx="10" fill="none" stroke="#fff" stroke-width="3"/>`+TX(t,size,'#fff'),
  disc:(t,bg,fg='#fff',size=30)=>`<circle cx="50" cy="50" r="46" fill="${bg}"/>`+TX(t,size,fg),
  lamp:()=>`<rect x="6" y="6" width="88" height="88" rx="14" fill="${BLUE}"/><path d="M44 30 A20 20 0 0 0 44 70 Z" fill="#fff"/><g stroke="#fff" stroke-width="5" stroke-linecap="round"><line x1="54" y1="34" x2="80" y2="34"/><line x1="54" y1="50" x2="80" y2="50"/><line x1="54" y1="66" x2="80" y2="66"/></g>`,
  road:()=>`<rect x="6" y="6" width="88" height="88" rx="14" fill="${BLUE}"/><path d="M38 84 L46 16 M62 84 L54 16" stroke="#fff" stroke-width="5"/><path d="M50 80 V68 M50 58 V48 M50 38 V30" stroke="#fff" stroke-width="3"/>`
};
const sign=(k,...a)=>sv(SIG[k](...a));

/* ============ Content: theory (each text is [Spanish, English]) ============ */
const TOPICS=[
 {id:'per',ic:()=>sign('info','B',BLUE,52),n:['El examen y el permiso B','The exam and the B licence'],s:[
  [['El examen teórico','The theory exam'],[
   ['30 preguntas tipo test con 3 respuestas cada una, en 30 minutos.','30 multiple-choice questions with 3 answers each, in 30 minutes.'],
   ['Apruebas (APTO) con un máximo de 3 fallos. Una pregunta sin contestar cuenta como fallo.','You pass (APTO) with at most 3 mistakes. An unanswered question counts as a mistake.'],
   ['El teórico aprobado es válido durante 2 años para presentarte al práctico.','A passed theory exam is valid for 2 years to sit the practical test.'],
   ['La DGT también ofrece el examen en otros idiomas (entre ellos, inglés) en muchos centros; confírmalo en tu Jefatura.','The DGT offers the exam in other languages (including English) at many centres; check with your local Jefatura.']]],
  [['Qué permite conducir el permiso B','What the B licence lets you drive'],[
   ['Edad mínima: 18 años.','Minimum age: 18.'],
   ['Vehículos de hasta 3.500 kg de MMA y hasta 9 plazas incluido el conductor.','Vehicles up to 3,500 kg maximum authorised mass and up to 9 seats including the driver.'],
   ['Remolque ligero de hasta 750 kg; uno más pesado si el conjunto no supera 3.500 kg.','A light trailer up to 750 kg; a heavier one if the combination does not exceed 3,500 kg.'],
   ['Con 3 años de antigüedad en España: motocicletas de hasta 125 cc y 11 kW.','After 3 years with the licence in Spain: motorcycles up to 125 cc and 11 kW.'],
   ['Conductor novel: placa "L" en la parte trasera izquierda durante el primer año.','New driver: "L" plate at the rear left for the first year.'],
   ['Vigencia: 10 años (5 años a partir de los 65).','Validity: 10 years (5 years from age 65).']]]]},
 {id:'sig',ic:()=>sign('danger'),n:['Señales y agentes','Signs and police signals'],s:[
  [['Orden de prioridad entre señales','Which signal wins'],[
   ['1) Agentes de tráfico, 2) señalización circunstancial (obras, balizas), 3) semáforos, 4) señales verticales, 5) marcas viales.','1) Traffic officers, 2) temporary signs (roadworks, beacons), 3) traffic lights, 4) vertical signs, 5) road markings.'],
   ['En obras, las marcas amarillas prevalecen sobre las blancas.','In roadworks, yellow markings take precedence over white ones.']]],
  [['Formas y colores','Shapes and colours'],[
   ['Triángulo con borde rojo: peligro. Círculo con borde rojo: prohibición. Círculo azul: obligación. Cuadrado o rectángulo azul: indicación.','Triangle with red border: danger. Circle with red border: prohibition. Blue circle: obligation. Blue square or rectangle: information.'],
   ['STOP (octógono rojo): detención obligatoria y ceder el paso. Ceda el paso (triángulo invertido): ceder sin obligación de parar si no viene nadie.','STOP (red octagon): you must stop and give way. Give way (inverted triangle): yield, no need to stop if the road is clear.'],
   ['Las señales de fin de prohibición tienen franjas diagonales negras.','End-of-restriction signs have black diagonal stripes.']]],
  [['Semáforos y agentes','Traffic lights and officers'],[
   ['Ámbar fijo: detente, salvo que no puedas hacerlo con seguridad. Ámbar intermitente: precaución y respeta las prioridades.','Steady amber: stop unless you cannot do so safely. Flashing amber: proceed with caution and observe priorities.'],
   ['Brazo levantado verticalmente: se detienen todos los que se aproximan al agente.','Arm raised vertically: everyone approaching the officer must stop.'],
   ['Brazos extendidos horizontalmente: se detienen quienes se aproximan de frente o por detrás del agente.','Arms extended horizontally: those approaching from the front or behind the officer must stop.']]],
  [['Marcas viales','Road markings'],[
   ['Línea continua: no se puede pisar ni rebasar. Discontinua: se puede rebasar para maniobrar.','Solid line: do not drive on or cross it. Broken line: may be crossed to manoeuvre.'],
   ['Flecha de retorno: se acaba la posibilidad de adelantar; vuelve a tu carril.','Return arrow: overtaking is ending; move back into your lane.'],
   ['Bordillo amarillo continuo: prohibido parar y estacionar. Discontinuo: prohibido estacionar.','Solid yellow kerb line: no stopping or parking. Broken: no parking.']]]]},
 {id:'vel',ic:()=>sign('max',90),n:['Velocidad y distancias','Speed and distances'],s:[
  [['Límites genéricos para turismos','General limits for cars'],[
   ['Autopista y autovía: 120 km/h. Velocidad mínima: 60 km/h.','Motorway and dual carriageway: 120 km/h. Minimum speed: 60 km/h.'],
   ['Carretera convencional: 90 km/h.','Conventional road: 90 km/h.'],
   ['Vía urbana con 2 o más carriles por sentido y travesías: 50 km/h. Un carril por sentido: 30 km/h. Plataforma única (acera y calzada al mismo nivel): 20 km/h.','Urban roads with 2+ lanes per direction and travesías: 50 km/h. One lane per direction: 30 km/h. Single-surface streets: 20 km/h.'],
   ['Ya no se puede superar el límite en 20 km/h para adelantar (eliminado en 2019).','You may no longer exceed the limit by 20 km/h to overtake (abolished in 2019).']]],
  [['Distancias','Distances'],[
   ['Distancia de detención = distancia de reacción + distancia de frenado.','Stopping distance = reaction distance + braking distance.'],
   ['Reacción: con 1 segundo recorres la velocidad / 3,6 metros (≈ 28 m a 100 km/h).','Reaction: in 1 second you travel speed / 3.6 metres (≈ 28 m at 100 km/h).'],
   ['Frenado en seco aproximado: (velocidad / 10)². Si duplicas la velocidad, se multiplica por 4.','Approximate dry braking: (speed / 10)². Double the speed and it multiplies by 4.'],
   ['Regla de los 2 segundos con el vehículo de delante; más con lluvia, niebla o noche.','Keep 2 seconds behind the vehicle in front; more in rain, fog or at night.'],
   ['En túneles: al menos 100 m o 4 segundos (turismos).','In tunnels: at least 100 m or 4 seconds (cars).']]]]},
 {id:'pri',ic:()=>sign('yield'),n:['Prioridad de paso','Right of way'],s:[
  [['Reglas básicas','Basic rules'],[
   ['Intersección sin señalizar: preferencia de los que vienen por la derecha.','Unsigned junction: vehicles coming from the right have priority.'],
   ['Excepciones: la vía pavimentada sobre la no pavimentada, los vehículos sobre raíles, y quien circula dentro de una glorieta.','Exceptions: paved roads over unpaved, rail vehicles, and traffic already inside a roundabout.'],
   ['Al salir de un garaje o propiedad, cedes el paso a todos.','Leaving a garage or property, you give way to everyone.']]],
  [['Estrechamientos y pendientes','Narrow sections and slopes'],[
   ['Estrechamiento sin señal: pasa primero el que haya entrado antes.','Unsigned narrowing: whoever entered first goes first.'],
   ['Tramo estrecho de gran pendiente: preferencia del que sube.','Narrow steep section: the vehicle going uphill has priority.']]],
  [['Peatones y emergencias','Pedestrians and emergencies'],[

/* ============ Question selection: weighted so unseen and previously failed questions come up more ============ */
function buildPool(topic,onlyMist){
  if(onlyMist)return Object.values(prog.mistakes);
  const pool=BANK.filter(q=>!topic||q.t===topic).slice();
  GENS.filter(g=>!topic||g.t===topic).forEach(g=>{const m=topic?g.n*2:g.n;for(let i=0;i<m;i++)pool.push(g.f())});
  const seenK=new Set(),out=[];
  for(const q of shuffle(pool)){const k=keyOf(q);if(!seenK.has(k)){seenK.add(k);out.push(q)}}
  return out;
}
function sample(pool,n){
  const recent=new Set(prog.recent||[]);
  return pool.map(q=>{const k=keyOf(q);let w=1/(1+(prog.seen[k]||0));if(prog.mistakes[k])w*=2.5;if(recent.has(k))w*=.25;return [Math.random()**(1/w),q]})
    .sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
const inst=q=>{const order=shuffle(q.o.map((_,i)=>i));return {q,order,correct:order.indexOf(0),chosen:null,checked:false}};

function startQuiz(mode,opts={}){
  let pool,n;
  if(mode==='exam'){pool=buildPool();n=30}
  else if(mode==='mist'){pool=buildPool(null,true);n=Math.min(pool.length,opts.n||20)}
  else {pool=buildPool(opts.topic);n=Math.min(pool.length,opts.n||10)}
  if(!pool.length)return;
  const items=sample(pool,n).map(inst);
  quiz={mode,items,i:0,topic:opts.topic||null,n:opts.n,start:Date.now(),deadline:mode==='exam'?Date.now()+30*60*1000:null,done:false};
  confirmFinish=false;go('quiz');
  if(mode==='exam'){clearInterval(timerId);timerId=setInterval(tick,1000)}
}
function tick(){
  if(!quiz||quiz.done||!quiz.deadline){clearInterval(timerId);return}
  const left=Math.max(0,quiz.deadline-Date.now());
  const el=document.getElementById('timer');
  if(el){el.textContent=fmtTime(left);el.classList.toggle('warn',left<5*60*1000)}
  if(left<=0)finishQuiz(true);
}
const fmtTime=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function record(it){
  const k=keyOf(it.q),ok=it.chosen===it.correct;
  prog.seen[k]=(prog.seen[k]||0)+1;
  const ts=prog.topic[it.q.t]||[0,0];ts[0]+=ok?1:0;ts[1]+=1;prog.topic[it.q.t]=ts;
  if(ok)delete prog.mistakes[k];else prog.mistakes[k]=it.q;
  prog.recent=[k,...(prog.recent||[]).filter(x=>x!==k)].slice(0,90);
}
function finishQuiz(timeUp){
  if(!quiz||quiz.done)return;
  clearInterval(timerId);
  quiz.done=true;quiz.timeUp=!!timeUp;
  if(quiz.mode==='exam'){quiz.items.forEach(record)}
  else quiz.items.filter(it=>it.chosen!==null&&!it.checked).forEach(it=>{it.checked=true;record(it)});
  const answered=quiz.items.filter(it=>quiz.mode==='exam'||it.chosen!==null);
  const errors=answered.filter(it=>it.chosen!==it.correct).length;
  quiz.errors=errors;quiz.total=answered.length;
  if(quiz.mode==='exam'){prog.exams.push({d:Date.now(),e:errors,p:errors<=3});prog.exams=prog.exams.slice(-50)}
  save();go('result');
}

function renderTabs(){
  const nm=Object.keys(prog.mistakes).length;
  const cur=view==='topic'?'theory':view==='quiz'||view==='result'?(quiz&&quiz.mode==='mist'?'mistakes':quiz&&quiz.mode==='exam'?'home':'practice'):view;
  document.getElementById('tabs').innerHTML=['home','theory','practice','mistakes'].map(t=>`<button data-go="${t}" ${cur===t?'aria-current="page"':''}>${ICONS[t]}<span>${u(t)}${t==='mistakes'&&nm?` <span class="badge">${nm}</span>`:''}</span></button>`).join('');
}
function topicAcc(id){const s=prog.topic[id];return s&&s[1]?s[0]/s[1]:null}
function vHome(){
  const ex=prog.exams,passed=ex.filter(e=>e.p).length;
  let r=0,t=0;Object.values(prog.topic).forEach(s=>{r+=s[0];t+=s[1]});
  const weak=TOPICS.map(tp=>[tp,topicAcc(tp.id),(prog.topic[tp.id]||[0,0])[1]]).filter(x=>x[1]!==null&&x[2]>=3).sort((a,b)=>a[1]-b[1]).slice(0,3);
  return `<div class="stack">
  <section class="panel"><div class="panel-in">
    <div class="eyebrow" style="color:rgba(255,255,255,.85)">${u('permit')} · DGT</div>
    <h1>${u('sim')}</h1>
    <div class="facts"><span>${u('q30')}</span><span>${u('m30')}</span><span>${u('e3')}</span></div>
    <button class="btn primary full" data-act="exam">${u('start')}</button>
  </div></section>
  <div class="row"><button class="btn" data-act="quick">${u('quick')}</button><button class="btn" data-go="theory">${u('theory')}</button></div>
  <div class="stats">
    <div class="stat"><b>${ex.length}</b><span>${u('exams')}</span></div>
    <div class="stat"><b>${ex.length?Math.round(passed/ex.length*100)+'%':'–'}</b><span>${u('passrate')}</span></div>
    <div class="stat"><b>${t?Math.round(r/t*100)+'%':'–'}</b><span>${u('acc')}</span></div>
  </div>
  <section class="card stack" style="gap:10px"><h3>${u('lastExams')}</h3>
    ${ex.length?`<div class="chips">${ex.slice(-10).reverse().map(e=>`<span class="chip ${e.p?'ok':'bad'}">${e.p?u('apto'):u('noapto')} · ${e.e} ${u('errors')}</span>`).join('')}</div>`:`<p class="muted">${u('noExams')}</p>`}
  </section>
  <section class="card stack" style="gap:12px"><h3>${u('weak')}</h3>
    ${weak.length?`<div class="bars">${weak.map(([tp,a])=>bar(tp,a)).join('')}</div>`:`<p class="muted">${u('weakEmpty')}</p>`}
  </section>
  <p class="muted" style="font-size:.8rem">${u('disclaimer')}</p></div>`;
}
function bar(tp,a){const p=Math.round(a*100);return `<button class="bar" data-act="ptopic" data-t="${tp.id}" style="border:0;background:none;padding:0;text-align:left"><span>${esc(tr(tp.n))}</span><b style="font-variant-numeric:tabular-nums">${p}%</b><span class="track"><span class="fill ${p<60?'low':p<85?'mid':''}" style="width:${p}%;display:block"></span></span></button>`}
function vTheory(){
  return `<div class="stack"><h1>${u('topics')}</h1><div class="list">${TOPICS.map(tp=>{const n=BANK.filter(q=>q.t===tp.id).length+GENS.filter(g=>g.t===tp.id).length*3;const a=topicAcc(tp.id);
    return `<button class="item" data-go="topic" data-arg="${tp.id}">${tp.ic()}<span class="t"><b>${esc(tr(tp.n))}</b><small>${n}+ ${u('qs')}${a!==null?' · '+Math.round(a*100)+'%':''}</small></span><span class="chev">›</span></button>`}).join('')}</div></div>`;
}
function vTopic(){
  const tp=TOPIC[arg];
  return `<div class="stack theory"><div style="display:flex;gap:12px;align-items:center">${tp.ic()}<h1 style="font-size:1.7rem">${esc(tr(tp.n))}</h1></div>
  ${tp.s.map(([h,items])=>`<section class="card"><h3>${esc(tr(h))}</h3><ul>${items.map(it=>`<li>${esc(tr(it))}</li>`).join('')}</ul></section>`).join('')}
  <button class="btn primary full" data-act="ptopic" data-t="${tp.id}">${u('practiceTopic')}</button></div>`;
}
let pSel={topic:null,n:10};
function vPractice(){
  return `<div class="stack"><h1>${u('practice')}</h1><p class="muted">${u('practiceIntro')}</p>
  <section class="card stack" style="gap:10px"><div class="eyebrow">${u('chooseTopic')}</div><div class="chips">
   <button class="chip" data-act="psel" data-t="" aria-pressed="${!pSel.topic}">${u('all')}</button>
   ${TOPICS.map(tp=>`<button class="chip" data-act="psel" data-t="${tp.id}" aria-pressed="${pSel.topic===tp.id}">${esc(tr(tp.n))}</button>`).join('')}</div></section>
  <section class="card stack" style="gap:10px"><div class="eyebrow">${u('length')}</div><div class="chips">
   ${[10,20,30].map(n=>`<button class="chip" data-act="plen" data-n="${n}" aria-pressed="${pSel.n===n}">${n}</button>`).join('')}</div></section>
  <button class="btn primary full" data-act="pstart">${u('go')}</button></div>`;
}
function vMistakes(){
  const ms=Object.values(prog.mistakes);
  if(!ms.length)return `<div class="stack"><h1>${u('mistakes')}</h1><div class="card empty">${sign('endAll')}<p>${u('noMist')}</p><button class="btn primary" data-act="exam">${u('start')}</button></div></div>`;
  return `<div class="stack"><h1>${u('mistakes')}</h1><p class="muted">${u('mistakesIntro')}</p>
  <div class="row"><button class="btn primary" data-act="mist">${u('reviewMist')} · ${Math.min(ms.length,20)}</button>
  <button class="btn" data-act="clearask">${u('clear')}</button></div>
  ${confirmClear?`<div class="confirm"><p>${u('clearQ')}</p><div class="row"><button class="btn primary" data-act="clearyes">${u('clear')}</button><button class="btn" data-act="clearno">${u('cancel')}</button></div></div>`:''}
  <div class="review">${ms.slice().reverse().map(q=>`<div class="card">${q.img?q.img.replace('class="sg"','class="sg"'):''}<span class="eyebrow">${esc(tr(TOPIC[q.t].n))}</span><p style="font-weight:600">${esc(tr(q.q))}</p><p class="ans ok">✓ ${esc(tr(q.o[0]))}</p></div>`).join('')}</div></div>`;
}
function vQuiz(){
  const it=quiz.items[quiz.i],q=it.q,n=quiz.items.length,exam=quiz.mode==='exam';
  const show=!exam&&it.checked;
  const opts=it.order.map((oi,pos)=>{let c='opt';if(show){if(pos===it.correct)c+=' right';else if(pos===it.chosen)c+=' wrong'}else if(pos===it.chosen)c+=' sel';
    return `<button class="${c}" data-act="pick" data-pos="${pos}" ${show?'disabled':''}><span class="k">${'ABC'[pos]}</span><span>${esc(tr(q.o[oi]))}</span></button>`}).join('');
  const unanswered=quiz.items.filter(x=>x.chosen===null).length;
  return `<div class="stack">
  <div class="qhead"><button class="btn" data-act="quit" style="min-height:40px;padding:6px 12px">${u('quit')}</button>
   <span class="eyebrow">${u('q')} ${quiz.i+1} ${u('of')} ${n}</span>
   ${exam?`<span class="timer" id="timer">${fmtTime(quiz.deadline-Date.now())}</span>`:`<span class="chip">${esc(tr(TOPIC[q.t].n)).split(' ')[0]}</span>`}</div>
  ${exam?`<div class="grid30">${quiz.items.map((x,i)=>`<button data-act="jump" data-i="${i}" class="${x.chosen!==null?'done':''} ${i===quiz.i?'cur':''}" aria-label="${u('q')} ${i+1}">${i+1}</button>`).join('')}</div>`:`<div class="progress"><i style="width:${(quiz.i+(it.checked?1:0))/n*100}%"></i></div>`}
  <section class="card stack" style="gap:14px">
   ${q.img?q.img.replace('class="sg"','class="sg big"'):''}
   <p class="qtext">${esc(tr(q.q))}</p>
   <div class="opts">${opts}</div>
   ${show?`<div class="explain"><b style="color:${it.chosen===it.correct?'var(--ok)':'var(--bad)'}">${it.chosen===it.correct?u('right'):u('wrong')}</b> ${esc(tr(q.x))}</div>`:''}
  </section>
  ${exam?`<div class="row"><button class="btn" data-act="prev" ${quiz.i===0?'disabled':''}>${u('prev')}</button>${quiz.i<n-1?`<button class="btn primary" data-act="next">${u('next')}</button>`:''}</div>
   <button class="btn full" data-act="finish">${u('finish')}</button>
   ${confirmFinish?`<div class="confirm"><p>${u('unanswered').replace('{n}',unanswered)}</p><div class="row"><button class="btn primary" data-act="finishyes">${u('yes')}</button><button class="btn" data-act="finishno">${u('no')}</button></div></div>`:''}`
  :`<button class="btn primary full" data-act="${it.checked?(quiz.i<n-1?'next':'finishyes'):'check'}" ${it.chosen===null?'disabled':''}>${it.checked?(quiz.i<n-1?u('next'):u('seeResults')):u('check')}</button>`}
  </div>`;
}
function vResult(){
  const exam=quiz.mode==='exam',pass=exam?quiz.errors<=3:quiz.errors/Math.max(1,quiz.total)<=.1;
  const okN=quiz.total-quiz.errors;
  return `<div class="stack">
  <div class="verdict ${pass?'pass':'fail'}">${quiz.timeUp?`<div class="eyebrow" style="color:#fff">${u('timeUp')}</div>`:''}
   <h1>${exam?(pass?u('apto'):u('noapto')):okN+' / '+quiz.total}</h1>
   <p style="font-size:1.1rem">${exam?`${quiz.errors} ${u('errors')} · ${okN} / ${quiz.total}`:u('score')}</p></div>
  <div class="row"><button class="btn primary" data-act="${exam?'exam':quiz.mode==='mist'?'mist':'pagain'}">${exam?u('again'):u('againP')}</button><button class="btn" data-go="home">${u('backHome')}</button></div>
  <h2>${u('review')}</h2>
  <div class="review">${quiz.items.filter(it=>exam||it.chosen!==null).map((it,i)=>{const ok=it.chosen===it.correct;return `<div class="card">
   <span class="eyebrow">${i+1} · ${esc(tr(TOPIC[it.q.t].n))}</span>${it.q.img||''}
   <p style="font-weight:600">${esc(tr(it.q.q))}</p>
   ${ok?`<p class="ans ok">✓ ${esc(tr(it.q.o[0]))}</p>`:`<p class="ans bad">✗ ${u('yours')}: ${it.chosen===null?u('none'):esc(tr(it.q.o[it.order[it.chosen]]))}</p><p class="ans ok">✓ ${u('correct')}: ${esc(tr(it.q.o[0]))}</p>`}
   <p class="muted" style="font-size:.9rem">${esc(tr(it.q.x))}</p></div>`}).join('')}</div></div>`;
}
const VIEWS={home:vHome,theory:vTheory,topic:vTopic,practice:vPractice,mistakes:vMistakes,quiz:vQuiz,result:vResult};
function render(){
  document.documentElement.lang=lang===0?'es':'en';
  document.getElementById('lang-es').setAttribute('aria-pressed',lang===0);
  document.getElementById('lang-en').setAttribute('aria-pressed',lang===1);
  if((view==='quiz'||view==='result')&&!quiz)view='home';
  document.getElementById('view').innerHTML=VIEWS[view]();
  renderTabs();
}
function go(v,a){if(view==='quiz'&&v!=='quiz'&&v!=='result'&&quiz&&!quiz.done){clearInterval(timerId);quiz=null}view=v;arg=a??arg;confirmClear=false;render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.arg);return}
  const lb=e.target.closest('[data-lang]');if(lb){lang=+lb.dataset.lang;store.set('lang',lang);render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='exam')startQuiz('exam');
  else if(a==='quick')startQuiz('practice',{n:10});
  else if(a==='ptopic')startQuiz('practice',{topic:b.dataset.t,n:10});
  else if(a==='pagain')startQuiz('practice',{topic:quiz.topic,n:quiz.n});
  else if(a==='mist')startQuiz('mist',{n:20});
  else if(a==='psel'){pSel.topic=b.dataset.t||null;render()}
  else if(a==='plen'){pSel.n=+b.dataset.n;render()}
  else if(a==='pstart')startQuiz('practice',{topic:pSel.topic,n:pSel.n});
  else if(a==='pick'){const it=quiz.items[quiz.i];if(it.checked)return;it.chosen=+b.dataset.pos;confirmFinish=false;render()}
  else if(a==='check'){const it=quiz.items[quiz.i];if(it.chosen===null)return;it.checked=true;record(it);save();render()}
  else if(a==='next'){quiz.i=Math.min(quiz.items.length-1,quiz.i+1);render();window.scrollTo(0,0)}
  else if(a==='prev'){quiz.i=Math.max(0,quiz.i-1);render()}
  else if(a==='jump'){quiz.i=+b.dataset.i;render()}
  else if(a==='finish'){const un=quiz.items.filter(x=>x.chosen===null).length;if(un){confirmFinish=true;render()}else finishQuiz()}
  else if(a==='finishyes')finishQuiz();
  else if(a==='finishno'){confirmFinish=false;render()}
  else if(a==='quit'){go(quiz.mode==='exam'?'home':quiz.mode==='mist'?'mistakes':'practice')}
  else if(a==='clearask'){confirmClear=true;render()}
  else if(a==='clearyes'){prog.mistakes={};save();confirmClear=false;render()}
  else if(a==='clearno'){confirmClear=false;render()}
});
render();
</script>
